<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi niña ❤️</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Amor">
    <link rel="apple-touch-icon" href="icono.jpg">

    <style>
        /* Reset y prevenir gestos extraños en iPhone */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            background-color: #d1e2c4; /* Soft Matcha */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            color: #4a5d23;
            min-height: 100vh;
        }

        h1 { font-size: 26px; margin-bottom: 5px; color: #3d4d1e; }
        p { font-size: 15px; margin-bottom: 25px; color: #5b7031; padding: 0 10px; }

        /* Contenedor del Rompecabezas */
        #puzzle-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            background-color: #fff;
            padding: 5px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .piece {
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            background-repeat: no-repeat;
            transition: all 0.2s ease;
        }

        .selected {
            border-color: #ff6b81;
            transform: scale(0.95);
            box-shadow: inset 0 0 10px rgba(255, 107, 129, 0.5);
        }

        button {
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #8dae72;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        button:active { transform: scale(0.95); }

        /* PANTALLA DE PREMIO (FULLSCREEN OVERLAY) */
        #pantalla-premio {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #d1e2c4;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .animar {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #pantalla-premio h2 {
            font-size: 28px;
            color: #d63031;
            margin-bottom: 25px;
            line-height: 1.2;
        }

        #imagen-premio {
            max-width: 90%;
            max-height: 55vh;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            object-fit: cover;
            border: 5px solid white;
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Para mi amor ❤️</h1>
    <p>Intercambia las piezas tocándolas para ver nuestra foto.</p>

    <div id="puzzle-container"></div>
    
    <button onclick="changePhoto()">Siguiente Foto ➔</button>

    <div id="pantalla-premio">
        <h2 class="animar">¡TE GANASTE UN BUBITAAAAA! 🍭❤️</h2>
        <img id="imagen-premio" class="animar" src="fotos/premio.jpg" alt="Tu Premio">
        <button class="animar" onclick="changePhoto()">¡Siguiente Nivel!</button>
    </div>

    <script>
        const fotos = [
            'fotos/foto1.jpg', 'fotos/foto2.jpg', 'fotos/foto3.jpg',
            'fotos/foto4.jpg', 'fotos/foto5.jpg', 'fotos/foto6.jpg',
            'fotos/foto7.jpg', 'fotos/foto8.jpg', 'fotos/foto9.jpg',
            'fotos/foto10.jpg', 'fotos/foto11.jpg', 'fotos/foto12.jpg'
        ];
        
        let fotoActual = 0;
        let container = document.getElementById('puzzle-container');
        let pantallaPremio = document.getElementById('pantalla-premio');
        let selectedPiece = null;

        function initPuzzle() {
            container.innerHTML = '';
            pantallaPremio.style.display = 'none';
            
            let img = new Image();
            img.src = fotos[fotoActual];
            
            img.onload = function() {
                // Ajuste dinámico para iPhone
                let maxWidth = Math.min(window.innerWidth - 40, 350);
                let ratio = img.naturalHeight / img.naturalWidth;
                
                let containerWidth = maxWidth;
                let containerHeight = maxWidth * ratio;

                container.style.width = containerWidth + 'px';
                container.style.height = containerHeight + 'px';

                let pWidth = containerWidth / 3;
                let pHeight = containerHeight / 3;

                let positions = [0, 1, 2, 3, 4, 5, 6, 7, 8];
                positions.sort(() => Math.random() - 0.5);

                for (let i = 0; i < 9; i++) {
                    let piece = document.createElement('div');
                    piece.classList.add('piece');
                    piece.style.backgroundImage = `url('${fotos[fotoActual]}')`;
                    piece.style.backgroundSize = `${containerWidth}px ${containerHeight}px`;

                    let mixedIndex = positions[i];
                    let row = Math.floor(mixedIndex / 3);
                    let col = mixedIndex % 3;

                    piece.style.backgroundPosition = `-${col * pWidth}px -${row * pHeight}px`;
                    piece.dataset.correctIndex = mixedIndex; 

                    piece.addEventListener('click', () => handlePieceClick(piece));
                    container.appendChild(piece);
                }
            };
        }

        function handlePieceClick(piece) {
            if (!selectedPiece) {
                selectedPiece = piece;
                piece.classList.add('selected');
            } else {
                let tempPos = selectedPiece.style.backgroundPosition;
                let tempIdx = selectedPiece.dataset.correctIndex;

                selectedPiece.style.backgroundPosition = piece.style.backgroundPosition;
                selectedPiece.dataset.correctIndex = piece.dataset.correctIndex;

                piece.style.backgroundPosition = tempPos;
                piece.dataset.correctIndex = tempIdx;

                selectedPiece.classList.remove('selected');
                selectedPiece = null;

                checkWin();
            }
        }

        function checkWin() {
            let pieces = document.querySelectorAll('.piece');
            let win = true;
            pieces.forEach((p, i) => {
                if (parseInt(p.dataset.correctIndex) !== i) win = false;
            });

            if (win) {
                setTimeout(() => {
                    pantallaPremio.style.display = 'flex';
                }, 400);
            }
        }

        function changePhoto() {
            fotoActual = (fotoActual + 1) % fotos.length;
            initPuzzle();
        }

        window.onload = initPuzzle;
        window.onresize = initPuzzle;
    </script>
</body>
</html>
