<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi amor ❤️</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Amor">
    <link rel="apple-touch-icon" href="icono.jpg">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            background-color: #d1e2c4; /* Soft Matcha */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            color: #4a5d23;
            min-height: 100vh;
        }

        h1 { font-size: 26px; margin-bottom: 5px; color: #3d4d1e; }
        p { font-size: 14px; margin-bottom: 25px; color: #5b7031; line-height: 1.4; }

        #puzzle-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            background-color: #fff;
            padding: 5px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .piece {
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            background-repeat: no-repeat;
            transition: border-color 0.2s;
        }

        .selected {
            border-color: #ff6b81;
            transform: scale(0.96);
            z-index: 10;
        }

        button {
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #8dae72;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* OVERLAY DE GANADOR FULLSCREEN */
        #pantalla-premio {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #d1e2c4;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .animar {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #pantalla-premio h2 {
            font-size: 28px;
            color: #d63031;
            margin-bottom: 25px;
        }

        #imagen-premio {
            max-width: 90%;
            max-height: 50vh;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            border: 5px solid white;
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Para mi amor ❤️</h1>
    <p>Toca dos piezas para intercambiarlas<br>y armar nuestro recuerdo.</p>

    <div id="puzzle-container"></div>
    
    <button onclick="changePhoto()">Siguiente Foto ➔</button>

    <div id="pantalla-premio">
        <h2 class="animar">TE GANASTE UN BUBITAAAAA ❤️🍭</h2>
        <img id="imagen-premio" class="animar" src="premio.jpg" alt="Premio">
        <button class="animar" onclick="changePhoto()">¡Jugar otra vez!</button>
    </div>

    <script>
        // LISTA DE FOTOS (Directamente en la raíz)
        const fotos = [
            'foto1.jpg', 'foto2.jpg', 'foto3.jpg', 'foto4.jpg', 
            'foto5.jpg', 'foto6.jpg', 'foto7.jpg', 'foto8.jpg', 
            'foto9.jpg', 'foto10.jpg', 'foto11.jpg', 'foto12.jpg'
        ];
        
        let fotoActual = 0;
        let container = document.getElementById('puzzle-container');
        let pantallaPremio = document.getElementById('pantalla-premio');
        let selectedPiece = null;

        function initPuzzle() {
            container.innerHTML = '';
            pantallaPremio.style.display = 'none';
            
            let img = new Image();
            img.src = fotos[fotoActual];
            
            img.onload = function() {
                // Ajuste para el ancho de iPhone
                let maxWidth = Math.min(window.innerWidth - 40, 350);
                let ratio = img.naturalHeight / img.naturalWidth;
                
                let cWidth = maxWidth;
                let cHeight = maxWidth * ratio;

                container.style.width = cWidth + 'px';
                container.style.height = cHeight + 'px';

                let pWidth = cWidth / 3;
                let pHeight = cHeight / 3;

                // Mezcla aleatoria
                let pos = [0, 1, 2, 3, 4, 5, 6, 7, 8];
                pos.sort(() => Math.random() - 0.5);

                for (let i = 0; i < 9; i++) {
                    let piece = document.createElement('div');
                    piece.classList.add('piece');
                    piece.style.backgroundImage = `url('${fotos[fotoActual]}')`;
                    piece.style.backgroundSize = `${cWidth}px ${cHeight}px`;

                    let mixedIdx = pos[i];
                    let row = Math.floor(mixedIdx / 3);
                    let col = mixedIdx % 3;

                    piece.style.backgroundPosition = `-${col * pWidth}px -${row * pHeight}px`;
                    piece.dataset.correctIndex = mixedIdx; 

                    piece.addEventListener('click', () => handlePieceClick(piece));
                    container.appendChild(piece);
                }
            };

            img.onerror = function() {
                alert("No encontré la foto: " + fotos[fotoActual] + ". Asegúrate de que esté subida a GitHub fuera de carpetas.");
            };
        }

        function handlePieceClick(piece) {
            if (!selectedPiece) {
                selectedPiece = piece;
                piece.classList.add('selected');
            } else {
                // Intercambio
                let tempPos = selectedPiece.style.backgroundPosition;
                let tempIdx = selectedPiece.dataset.correctIndex;

                selectedPiece.style.backgroundPosition = piece.style.backgroundPosition;
                selectedPiece.dataset.correctIndex = piece.dataset.correctIndex;

                piece.style.backgroundPosition = tempPos;
                piece.dataset.correctIndex = tempIdx;

                selectedPiece.classList.remove('selected');
                selectedPiece = null;

                checkWin();
            }
        }

        function checkWin() {
            let pieces = document.querySelectorAll('.piece');
            let isWin = true;
            pieces.forEach((p, i) => {
                if (parseInt(p.dataset.correctIndex) !== i) isWin = false;
            });

            if (isWin) {
                setTimeout(() => {
                    pantallaPremio.style.display = 'flex';
                }, 400);
            }
        }

        function changePhoto() {
            fotoActual = (fotoActual + 1) % fotos.length;
            initPuzzle();
        }

        window.onload = initPuzzle;
        window.onresize = initPuzzle;
    </script>
</body>
</html>
